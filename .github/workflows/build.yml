name: Build Workflow
on:
  push:
    branches:
      - main
      - dev/ci-workflow
  pull_request:
    branches:
      - main

jobs:

  client-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client
        working-directory: client
        run: npm run build

  services-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Build Python prediction service
        working-directory: server/services/prediction
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m py_compile prediction_service.py
          python -c "from prediction_service import app; print(app.name)"

      - name: Build Spring Boot report service
        working-directory: server/services/report-service
        run: mvn -B clean package

  
  server-build:
    runs-on: ubuntu-latest

    needs: [services-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Validate Node.js server
        working-directory: server
        run:
          node --check index.js



        