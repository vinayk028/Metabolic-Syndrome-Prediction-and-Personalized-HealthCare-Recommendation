name: Build Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  client-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client
        working-directory: client
        run: npm run build

  services-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          cache-dependency-path: server/src/services/report-service/pom.xml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: server/src/services/prediction/requirements.txt

      - name: Build Python prediction service
        working-directory: server/src/services/prediction
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m py_compile prediction_service.py
          python -c "from prediction_service import app; print(app.name)"

      - name: Build Spring Boot report service
        working-directory: server/src/services/report-service
        run: mvn -B clean package

  
  server-build:
    runs-on: ubuntu-latest

    needs: [services-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server/src
        run: npm ci

      - name: Validate Node.js server
        working-directory: server/src
        run: node --check index.js



        