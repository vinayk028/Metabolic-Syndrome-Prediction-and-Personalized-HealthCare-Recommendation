name: CI Workflow
on:
  workflow_run:
    workflows: ["Build Workflow"]
    types:
      - completed

jobs:
  docker-build:
    # changed: only publish after a successful push to main, not after PR runs
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Client
      - name: Build and push Client Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |                         
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |                              
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-client:1.0.${{ github.run_number }}

      # Server
      - name: Build and push Server Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |                               
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-server:1.0.${{ github.run_number }}

      # Prediction Service
      - name: Build and push Prediction Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/src/services/prediction/Dockerfile
          push: true
          tags: |                               
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-prediction-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-prediction-service:1.0.${{ github.run_number }}

      # Report Service
      - name: Build and push Report Service Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server/src/services/report-service
          file: ./server/src/services/report-service/Dockerfile
          push: true
          tags: |                               
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-report-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mets-report-service:1.0.${{ github.run_number }}