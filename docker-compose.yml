services:
  mongo:
    image: mongo:7
    container_name: mets-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  prediction-service:
    image: mets/prediction-service:latest
    build:
      context: .
      dockerfile: ./server/src/services/prediction/Dockerfile
    container_name: mets-prediction-service
    ports:
      - "${PREDICTION_PORT:-5001}:5001"
    environment:
      PORT: ${PREDICTION_PORT:-5001}
      MODEL_PATH: /app/PredictionModel/src/Bayesian_Model/Bayesian_Prediction_Model.pkl

    restart: unless-stopped

  report-service:
    image: mets/report-service:latest
    build:
      context: ./server/src/services/report-service
    container_name: mets-report-service
    ports:
      - "${REPORT_PORT:-8081}:8081"
    restart: unless-stopped

  server:
    image: mets/server:latest
    build:
      context: ./server
    container_name: mets-server
    env_file:
      - ./.env
    depends_on:
      mongo:
        condition: service_started
      prediction-service:
        condition: service_started
      report-service:
        condition: service_started
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${SERVER_PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/mets-app}
      MONGODB_URI_PROD: ${MONGODB_URI_PROD}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://prediction-service:5001}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report-service:8081}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-3-flash-preview}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  client:
    image: mets/client:latest
    build:
      context: ./client
    container_name: mets-client
    depends_on:
      server:
        condition: service_started
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CLIENT_PORT:-3000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped

volumes:
  mongo-data:
